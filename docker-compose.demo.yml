services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      RAG_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
