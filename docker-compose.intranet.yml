services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    env_file:
      - .env.production
    volumes:
      - ${XYFRAG_DATA_DIR:-/opt/xyfrag/data}:/app/data
      - ${XYFRAG_MODELS_DIR:-/opt/xyfrag/models}:/app/models
      - ${XYFRAG_LOGS_DIR:-/opt/xyfrag/logs}:/app/logs
    expose:
      - "8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:24-slim}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      RAG_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
