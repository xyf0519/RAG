services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        BACKEND_BASE_IMAGE: ${BACKEND_BASE_IMAGE:-rag-backend-base:latest}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-zju.edu.cn}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - xyfrag_data:/app/data
      - xyfrag_models:/app/models
      - xyfrag_logs:/app/logs
    expose:
      - "8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:24-slim}
    environment:
      NODE_ENV: production
      RAG_BACKEND_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  xyfrag_data:
  xyfrag_models:
  xyfrag_logs:
