app:
  name: xyfRAG
  host: 0.0.0.0
  port: 8000
  log_level: INFO

paths:
  raw_docs_dir: data/raw
  index_dir: data/index
  classifier_dir: models/boundary_classifier
  log_file: logs/xyfrag.log

boundary_classifier:
  enabled: true
  threshold: 0.55

retrieval:
  chunk_size: 420
  chunk_overlap: 80
  bm25_top_k: 8
  embedding_top_k: 8
  rerank_top_k: 3
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  reranker_model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  use_local_models: false

llm:
  provider: openai_compatible
  model: gpt-4.1-mini
  temperature: 0.2
  timeout_seconds: 30
  max_tokens: 900
  allow_mock_when_no_key: true

frontend:
  backend_url: http://127.0.0.1:8000
