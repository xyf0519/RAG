app:
  name: xyfRAG
  host: 0.0.0.0
  port: 8000
  log_level: INFO

paths:
  raw_docs_dir: data/raw
  index_dir: data/index
  classifier_dir: models/boundary_classifier
  log_file: logs/xyfrag.log

boundary_classifier:
  enabled: true
  threshold: 0.55

retrieval:
  chunk_size: 420
  chunk_overlap: 80
  bm25_top_k: 8
  embedding_top_k: 8
  rerank_top_k: 3
  embedding_backend: bge
  embedding_model: models/huggingface/bge-small-zh-v1.5
  reranker_backend: lexical
  reranker_model: ""
  use_local_models: true
  allow_model_fallback: true

llm:
  provider: openai_compatible
  model: deepseek-v4-flash
  temperature: 0.2
  timeout_seconds: 30
  max_tokens: 900
  allow_mock_when_no_key: true

frontend:
  backend_url: http://127.0.0.1:8000
